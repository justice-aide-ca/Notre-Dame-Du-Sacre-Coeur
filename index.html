<style>
  :root{
    --violet:#3d3866; --violet-clair:#57518c; --or:#c9a227;
    --fond:#f6f5f2; --carte:#ffffff; --texte:#2b2a33; --discret:#6f6d7a;

    --bordure:#e3e1ea; --rayon:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--fond);color:var(--texte);line-height:1.55}
  header{background:linear-gradient(135deg,var(--violet),var(--violet-clair));color:#fff;padding:18px 20px}
  header .bandeau{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:1.35rem;font-weight:600}
  header .sous-titre{font-size:.85rem;opacity:.85}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav a{color:#fff;text-decoration:none;font-size:.85rem;padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.35)}
  nav a:hover,nav a.actif{background:rgba(255,255,255,.18)}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
  .carte{background:var(--carte);border:1px solid var(--bordure);border-radius:var(--rayon);padding:24px;margin-bottom:20px}
  h2{color:var(--violet);font-size:1.25rem;margin-bottom:12px}
  h3{color:var(--violet);font-size:1.05rem;margin:18px 0 8px}
  p{margin-bottom:10px}
  .discret{color:var(--discret);font-size:.9rem}
  .accroche{font-size:1.05rem;margin-bottom:18px}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .tuile{display:block;background:#fff;border:1px solid var(--bordure);border-radius:var(--rayon);padding:18px;text-decoration:none;color:var(--texte);transition:box-shadow .15s,border-color .15s}
  .tuile:hover{border-color:var(--violet-clair);box-shadow:0 4px 14px rgba(61,56,102,.12)}
  .tuile .icone{font-size:1.6rem}
  .tuile strong{display:block;color:var(--violet);margin:6px 0 4px}
  .tuile span{font-size:.85rem;color:var(--discret)}
  label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 5px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bordure);border-radius:9px;font-size:.95rem;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--violet-clair);outline-offset:0}
  textarea{min-height:90px;resize:vertical}
  .btn{display:inline-block;background:var(--violet);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer;text-decoration:none;margin-top:16px}
  .btn:hover{background:var(--violet-clair)}
  .btn.secondaire{background:#fff;color:var(--violet);border:1px solid var(--violet)}
  .btn.petit{padding:6px 14px;font-size:.85rem;margin-top:0}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .encart{border-left:4px solid var(--or);background:#fbf7ea;padding:14px 16px;border-radius:0 10px 10px 0;margin:14px 0;font-size:.92rem}
  .encart.bleu{border-color:var(--bleu);background:#eef4fa}
  .encart.vert{border-color:var(--vert);background:#edf7f1}
  .encart.rouge{border-color:var(--rouge);background:#faeeee}
  .canon{color:var(--discret);font-size:.82rem;font-style:italic}
  ul.liste{margin:6px 0 12px 20px}
  ul.liste li{margin-bottom:5px}
  ol.etapes{margin:6px 0 12px 0;list-style:none;counter-reset:etape}
  ol.etapes li{counter-increment:etape;position:relative;padding:8px 0 8px 42px;border-bottom:1px dashed var(--bordure)}
  ol.etapes li::before{content:counter(etape);position:absolute;left:0;top:8px;width:28px;height:28px;background:var(--violet);color:#fff;border-radius:50%;text-align:center;line-height:28px;font-size:.85rem;font-weight:600}
  .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.78rem;font-weight:600;color:#fff;white-space:nowrap}
  .st-nouvelle{background:var(--rouge)} .st-instruction{background:var(--orange)}
  .st-preparation{background:var(--bleu)} .st-prete{background:var(--vert)} .st-celebree{background:var(--violet)}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:9px 10px;border-bottom:1px solid var(--bordure);text-align:left;vertical-align:top}
  th{color:var(--violet);font-size:.82rem;text-transform:uppercase;letter-spacing:.4px}
  tr.cliquable{cursor:pointer} tr.cliquable:hover{background:#f3f1f8}
  .filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filtres button{border:1px solid var(--bordure);background:#fff;border-radius:20px;padding:5px 14px;font-size:.82rem;cursor:pointer}
  .filtres button.actif{background:var(--violet);color:#fff;border-color:var(--violet)}
  .check label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:8px 0}
  .check input{width:auto;margin-top:4px}
  .detail-cle{font-weight:600;color:var(--violet)}
  .deux-col{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  @media(max-width:640px){.deux-col{grid-template-columns:1fr}}
  .progression{display:flex;gap:0;margin:20px 0;flex-wrap:wrap}
  .progression .pas{flex:1;min-width:120px;text-align:center;font-size:.78rem;padding:10px 6px;background:#eee;border-radius:0;color:var(--discret);border-right:2px solid #fff}
  .progression .pas.fait{background:var(--violet);color:#fff}
  .progression .pas.courant{background:var(--or);color:#fff;font-weight:700}
  footer{background:#eceae2;text-align:center;padding:16px;font-size:.8rem;color:var(--discret)}
  .retour{display:inline-block;margin-bottom:14px;color:var(--violet);text-decoration:none;font-size:.9rem}
  .retour:hover{text-decoration:underline}
  .ref-num{font-size:1.3rem;font-weight:700;color:var(--violet);letter-spacing:1px}
  .actions-ligne{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .cache{display:none}
  .carte-compte{border:1px solid var(--bordure);border-radius:10px;margin-bottom:10px;padding:0 14px}
  .carte-compte summary{cursor:pointer;padding:12px 0;font-size:.95rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .carte-compte[open] summary{border-bottom:1px dashed var(--bordure);color:var(--violet)}
  .carte-compte input{margin-bottom:6px}
  @media print{header,nav,footer,.btn,.filtres,.retour,.actions-ligne{display:none!important} .carte{border:none;padding:0}}
</style>
</head>

<script>
/* ============================================================
   DONNÉES DE BASE
   Cadre : Code de droit canonique de 1983 (CIC).
   Les particularités diocésaines sont saisies dans les Paramètres.
   ============================================================ */

const STATUTS = [
  {id:"nouvelle",    nom:"Nouvelle demande"},
  {id:"instruction", nom:"En instruction (vérifications canoniques)"},
  {id:"preparation", nom:"En préparation"},
  {id:"prete",       nom:"Prête pour la célébration"},
  {id:"celebree",    nom:"Célébrée"}
];
function nomStatut(id){const s=STATUTS.find(s=>s.id===id);return s?s.nom:id;}

const PARAMS_DEFAUT = {
  paroisse:"Paroisse Saint-Exemple",
  diocese:"Diocèse de …",
  cure:"",
  adresse:"",
  telephone:"",
  email:"",
  directives:""
};

function chargerParams(){
  try{const p=JSON.parse(localStorage.getItem("pa_params"));return Object.assign({},PARAMS_DEFAUT,p||{});}
  catch(e){return Object.assign({},PARAMS_DEFAUT);}
}
function sauverParams(p){localStorage.setItem("pa_params",JSON.stringify(p));}

function chargerDemandes(){
  try{return JSON.parse(localStorage.getItem("pa_demandes"))||[];}catch(e){return [];}
}
function sauverDemandes(d){localStorage.setItem("pa_demandes",JSON.stringify(d));}

function genererRef(sacId){
  const prefixe=sacId.slice(0,3).toUpperCase();
  const alea=Math.random().toString(36).slice(2,6).toUpperCase();
  return prefixe+"-"+new Date().getFullYear()+"-"+alea;
}
function formatDate(d){if(!d)return "—";const dt=new Date(d);return isNaN(dt)?d:dt.toLocaleDateString("fr-FR");}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
</script>

function viewSuivi(){

    +'<form id="formSuivi"><label for="ref">Numéro de référence</label><input id="ref" required placeholder="XXX-2026-XXXX">'
    +'<button class="btn" type="submit">Rechercher</button></form><div id="suivi-resultat"></div></div>';

function renderSuivi(ref){
  const zone=document.getElementById("suivi-resultat");
  const d=chargerDemandes().find(x=>x.ref.toUpperCase()===ref.toUpperCase());
  if(!d){zone.innerHTML='<div class="encart rouge">Aucune demande trouvée avec ce numéro. Vérifiez la référence ou contactez le secrétariat.</div>';return;}
  const s=sacrement(d.sacrement);
  const idx=STATUTS.findIndex(x=>x.id===d.statut);
  let message="";
  if(d.statut==="nouvelle") message="Votre demande a été reçue. L'équipe pastorale va prendre contact avec vous.";
  else if(d.statut==="instruction") message="Votre demande est en cours d'instruction : vérification des conditions et des documents.";
  else if(d.statut==="preparation") message="Vous êtes en période de préparation. Suivez les étapes indiquées par l'équipe pastorale.";
  else if(d.statut==="prete") message="Tout est prêt pour la célébration ! La date sera confirmée avec vous.";
  else if(d.statut==="celebree") message="La célébration a eu lieu"+(d.dateCelebration?" le "+formatDate(d.dateCelebration):"")+". Que Dieu vous bénisse !";

    +progressionHTML(d.statut)+'<div class="encart bleu">'+message+'</div>';
}

<script>

let FILTRE_STATUT="tous", FILTRE_PAROISSE="toutes";

    +paroisses.map(x=>'<option '+(FILTRE_PAROISSE===x?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>';

    .sort((a,b)=>(b.dateDemande||"").localeCompare(a.dateDemande||""));

    const s=sacrement(d.sacrement);
    return '<tr class="cliquable" data-detail="'+d.ref+'"><td><strong>'+esc(d.ref)+'</strong></td><td>'+s.icone+' '+esc(s.nom)+'</td><td>'+esc(d.paroisse)+'</td><td>'+esc(d.contact.nom)+'</td><td>'+formatDate(d.dateDemande)+'</td><td>'+(d.statut==="celebree"?formatDate(d.dateCelebration):formatDate(d.dateSouhaitee))+'</td><td><span class="badge st-'+d.statut+'">'+nomStatut(d.statut)+'</span></td></tr>';

    +'<p class="discret">Réservé à l\'équipe pastorale. Chaque demande suit le parcours : <em>demande → instruction → préparation → célébration</em>. Cliquez sur une ligne pour ouvrir la fiche.</p>'
    +'<div class="filtres">'+boutons+'</div><div style="margin-bottom:12px">'+selPar+'</div>'

}

  const demandes=chargerDemandes();

  if(!d) return viewParoisse();

  const details=(d.details||[]).map(x=>'<p><span class="detail-cle">'+esc(x.label)+' :</span> '+esc(x.valeur)+'</p>').join("");
  const check='<div class="check">'+s.checklist.map((c,i)=>{
    const ok=d.checklist&&d.checklist[i];
    return '<label><input type="checkbox" data-check="'+i+'" data-ref="'+d.ref+'" '+(ok?"checked":"")+'> '+esc(c)+'</label>';
  }).join("")+'</div>';
  const termine=d.statut==="celebree";
  const btnSuite=termine?"":'<button class="btn petit" data-avancer="'+d.ref+'">Passer à l\'étape suivante &rarr;</button>';
  const champDate=(d.statut==="prete")?'<label for="date-celebration">Date de la célébration</label><input type="date" id="date-celebration" style="max-width:240px">':"";
  return '<a class="retour" href="#/paroisse">&larr; Toutes les demandes</a>'
    +'<div class="carte"><h2>'+s.icone+' '+esc(s.nom)+' — '+esc(d.ref)+'</h2>'
    +progressionHTML(d.statut)
    +'<div class="deux-col"><div>'
    +'<h3>Demande</h3>'
    +'<p><span class="detail-cle">Paroisse :</span> '+esc(d.paroisse)+'<br><span class="detail-cle">Reçue le :</span> '+formatDate(d.dateDemande)+'<br><span class="detail-cle">Date souhaitée :</span> '+formatDate(d.dateSouhaitee)+'</p>'

    +'<h3>Contact</h3><p>'+esc(d.contact.nom)+'<br>Tél. : '+esc(d.contact.tel)+(d.contact.courriel?'<br>Courriel : '+esc(d.contact.courriel):"")+'</p>'
    +'</div><div>'
    +'<h3>Liste de contrôle canonique</h3>'+check
    +champDate
    +'<div class="actions-ligne">'+btnSuite+'</div>'
    +(termine&&d.dateCelebration?'<div class="encart vert">Célébrée le '+formatDate(d.dateCelebration)+'. Pensez à l\'inscription au registre.</div>':"")
    +'</div></div>'
    +'<h3>Note pastorale (interne)</h3><textarea id="note-interne" data-ref="'+d.ref+'" placeholder="Observations, suites à donner…">'+esc(d.note||"")+'</textarea>'
    +'</div>';
}

function avancerDemande(ref){
  const demandes=chargerDemandes();
  const d=demandes.find(x=>x.ref===ref); if(!d) return;
  const idx=STATUTS.findIndex(x=>x.id===d.statut);
  if(idx<STATUTS.length-1){
    d.statut=STATUTS[idx+1].id;
    if(d.statut==="celebree"){
      const champ=document.getElementById("date-celebration");
      d.dateCelebration=(champ&&champ.value)?champ.value:new Date().toISOString().slice(0,10);
    }
    sauverDemandes(demandes);
  }
  route();
}

function exportCSV(nom,lignes){
  const csv=lignes.map(l=>l.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nom;a.click();URL.revokeObjectURL(a.href);
}

/* ---------- Rapport pastoral ---------- */
function periodePastoraleOK(d){
  if(d.statut!=="celebree"||!d.dateCelebration) return false;
  if(!d.dateCelebration.startsWith(R_ANNEE)) return false;
  if(R_MOIS!=="tous"&&d.dateCelebration.slice(5,7)!==R_MOIS) return false;
  return true;
}

  const demandes=chargerDemandes(); const paroisses=chargerParoisses();
  const selAn='<select id="rap-annee">'+anneesDispo().map(a=>'<option '+(R_ANNEE===a?"selected":"")+'>'+a+'</option>').join("")+'</select>';
  const selMo='<select id="rap-mois"><option value="tous">Toute l\'année</option>'+MOIS_NOMS.map((m,i)=>'<option value="'+String(i+1).padStart(2,"0")+'" '+(R_MOIS===String(i+1).padStart(2,"0")?"selected":"")+'>'+m+'</option>').join("")+'</select>';
  const periodeLib=R_MOIS==="tous"?R_ANNEE:MOIS_NOMS[parseInt(R_MOIS,10)-1]+" "+R_ANNEE;

  const lignes=SACREMENTS.map(s=>{

  return '<h3>Rapport pastoral — '+esc(periodeLib)+'</h3>'
    +'<div class="actions-ligne" style="margin:0 0 12px">'+selAn+selMo+'<button class="btn petit secondaire" id="btn-csv-pastoral">Exporter CSV</button><button class="btn petit secondaire btn-print">Imprimer</button></div>'

    +'</tbody></table></div>'

function exportPastoralCSV(){
  const demandes=chargerDemandes(); const paroisses=chargerParoisses();
  const lignes=[["Rapport pastoral",R_MOIS==="tous"?R_ANNEE:MOIS_NOMS[parseInt(R_MOIS,10)-1]+" "+R_ANNEE],["Sacrement"].concat(paroisses,["Total","En cours"])];
  SACREMENTS.forEach(s=>{
    const cellules=paroisses.map(p=>demandes.filter(d=>d.sacrement===s.id&&d.paroisse===p&&periodePastoraleOK(d)).length);
    lignes.push([s.nom].concat(cellules,[cellules.reduce((a,b)=>a+b,0),demandes.filter(d=>d.sacrement===s.id&&d.statut!=="celebree").length]));
  });

/* ---------- Rapport financier ---------- */
function entreesPeriode(){
  return chargerFinances().filter(f=>{
    if(F_PERIODE==="mois") return f.mois===F_MOIS;
    return (f.mois||"").startsWith(F_ANNEE);
  }).filter(f=>F_PAROISSE==="consolide"||f.paroisse===F_PAROISSE);
}
function sommeCat(entrees,bloc,code){return entrees.reduce((t,f)=>t+(((bloc==="rev"?f.rev:f.dep)||{})[code]||0),0);}
function pct(v,pv){if(!pv) return "—";return (((v-pv)/Math.abs(pv))*100).toFixed(1)+" %";}

/* Génère les lignes d'un état des résultats selon le plan comptable.
   Si entreesPrev est fourni (rapport annuel), ajoute les colonnes
   année précédente, $ change et % change — comme le rapport QuickBooks. */
function lignesPL(plan,entrees,bloc,entreesPrev){
  let html="",total=0,totalPrev=0;
  plan.forEach(g=>{
    let gt=0,gp=0,rows="";
    g.comptes.forEach(c=>{
      const v=sommeCat(entrees,bloc,c[0]);
      const pv=entreesPrev?sommeCat(entreesPrev,bloc,c[0]):0;
      gt+=v; gp+=pv;
      rows+='<tr><td style="padding-left:22px">'+c[0]+' \u00b7 '+esc(c[1])+'</td><td style="text-align:right">'+fmtD(v)+'</td>'
        +(entreesPrev?'<td style="text-align:right">'+fmtD(pv)+'</td><td style="text-align:right">'+fmtD(v-pv)+'</td><td style="text-align:right">'+pct(v,pv)+'</td>':"")+'</tr>';
    });
    total+=gt; totalPrev+=gp;
    html+='<tr style="background:#f3f1f8"><td colspan="'+(entreesPrev?5:2)+'"><strong>'+g.code+' \u00b7 '+esc(g.nom).toUpperCase()+'</strong></td></tr>'+rows
      +'<tr style="border-top:1px solid var(--bordure)"><td><strong>Total '+g.code+' \u00b7 '+esc(g.nom)+'</strong></td><td style="text-align:right"><strong>'+fmtD(gt)+'</strong></td>'
      +(entreesPrev?'<td style="text-align:right"><strong>'+fmtD(gp)+'</strong></td><td></td><td></td>':"")+'</tr>';
  });
  return {html:html,total:total,totalPrev:totalPrev};
}

function entreesPrecedentes(){
  if(F_PERIODE!=="annee") return null;
  const an=String(parseInt(F_ANNEE,10)-1);
  return chargerFinances().filter(f=>(f.mois||"").startsWith(an)).filter(f=>F_PAROISSE==="consolide"||f.paroisse===F_PAROISSE);
}

/* ---------- Bilan (par paroisse) ---------- */
function resultatExercice(paroisse,moisRef){
  const an=moisRef.slice(0,4);
  const e=chargerFinances().filter(f=>f.paroisse===paroisse&&(f.mois||"").startsWith(an)&&f.mois<=moisRef);
  const r=PLAN_REV.reduce((t,g)=>t+g.comptes.reduce((x,c)=>x+sommeCat(e,"rev",c[0]),0),0);
  const d=PLAN_DEP.reduce((t,g)=>t+g.comptes.reduce((x,c)=>x+sommeCat(e,"dep",c[0]),0),0);
  return r-d;
}

function exportFinCSV(){
  const entrees=entreesPeriode();
  const prev=entreesPrecedentes();
  const lignes=[["\u00c9tat des r\u00e9sultats",F_PERIODE==="mois"?F_MOIS:"Ann\u00e9e "+F_ANNEE,F_PAROISSE==="consolide"?"Unit\u00e9 consolid\u00e9e":F_PAROISSE]];
  function blocCSV(plan,bloc,titre){
    lignes.push([titre,"Montant"]);let total=0;
    plan.forEach(g=>{
      lignes.push([g.code+" - "+g.nom,""]);
      g.comptes.forEach(c=>{const v=sommeCat(entrees,bloc,c[0]);total+=v;lignes.push([c[0]+" - "+c[1],v.toFixed(2)]);});
      lignes.push(["Total "+g.code,plan===PLAN_REV||plan===PLAN_DEP?total.toFixed(2):""]);
    });
    return total;
  }
  const tr=blocCSV(PLAN_REV,"rev","REVENUS");
  const td=blocCSV(PLAN_DEP,"dep","DEPENSES");
  lignes.push(["Total revenus",tr.toFixed(2)]);
  lignes.push(["Total d\u00e9penses",td.toFixed(2)]);
  lignes.push(["R\u00e9sultat net",(tr-td).toFixed(2)]);
  exportCSV("etat-resultats-"+(F_PERIODE==="mois"?F_MOIS:F_ANNEE)+".csv",lignes);
}
function exportBilanCSV(){

  if(!b) return;
  const lignes=[["Bilan",b.paroisse,"En date de "+b.mois],["ACTIF","Montant"]];
  BILAN_ACTIF.forEach(c=>lignes.push([c[1],((b.actif||{})[c[0]]||0).toFixed(2)]));
  lignes.push(["PASSIF","Montant"]);
  BILAN_PASSIF.forEach(c=>lignes.push([c[1],((b.passif||{})[c[0]]||0).toFixed(2)]));
  lignes.push(["B\u00e9n\u00e9fices non r\u00e9partis",(b.bnr||0).toFixed(2)]);
  lignes.push(["R\u00e9sultat de l\u2019exercice",resultatExercice(b.paroisse,b.mois).toFixed(2)]);
  exportCSV("bilan-"+b.paroisse.replace(/\s+/g,"-")+"-"+b.mois+".csv",lignes);
}

<script>
/* ============================================================
   VIE LITURGIQUE — guides des célébrations spéciales
   Chaque année, le diocèse propose des documents pour ces
   célébrations (voir Paramètres → Guides diocésains).
   Les dates sont calculées automatiquement (comput pascal).
   ============================================================ */
function paques(a){
  const n=a%19,b=Math.floor(a/100),c=a%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*n+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((n+11*h+22*l)/451);
  return new Date(a,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1);
}
function premierAvent(a){
  const w=new Date(a,11,25).getDay();
  const ds4=new Date(a,11,25-(w===0?7:w));
  return new Date(ds4.getTime()-21*86400000);
}
function jours(date,decal){return new Date(date.getTime()+decal*86400000);}
function plage(debut,fin){return formatDate(debut)+" au "+formatDate(fin);}

function datesGuide(id){
  const maintenant=new Date(); maintenant.setHours(0,0,0,0);
  const a=maintenant.getFullYear();
  const candidats=[];
  [a,a+1].forEach(an=>{
    if(id==="avent") candidats.push({label:"Avent "+an,debut:premierAvent(an),fin:new Date(an,11,24)});
    if(id==="noel") candidats.push({label:"Noël "+an,debut:new Date(an,11,24),fin:new Date(an,11,25)});
    if(id==="careme") candidats.push({label:"Carême "+an,debut:jours(paques(an),-46),fin:jours(paques(an),-4)});
    if(id==="triduum") candidats.push({label:"Triduum pascal "+an,debut:jours(paques(an),-3),fin:paques(an)});
  });
  return candidats.filter(c=>c.fin>=maintenant).slice(0,2);
}

<script>

   RAPPORT ANNUEL — ASSEMBLÉE GÉNÉRALE ANNUELLE (AGA)
   D'après le modèle de la Paroisse de l'Assomption (AGA 2025) :
   ordre du jour, rapport du CPAÉ, synthèse financière comparative,
   rapport statistique, sections narratives.
   La synthèse financière et les statistiques sont insérées
   automatiquement à partir des données de la plateforme.
   Cadre : compte rendu de la gestion aux fidèles (CIC c. 1287 §1).
   ============================================================ */
const AGA_SECTIONS=[
 ["cpae","Rapport du CPAÉ (membres, réunions, gestion des affaires économiques)"],
 ["cimetiere","Cimetière (état du projet, capacité)"],
 ["projets_acheves","Projets achevés"],

 ["liturgique","Comité liturgique"],
 ["chorales","Chorales et musiciens"],
 ["evenements","Événements paroissiaux"],
 ["benevoles","Bénévoles et varia"]
];
let AGA_PAR="", AGA_AN=String(new Date().getFullYear()-1);

function chargerAGA(){try{return JSON.parse(localStorage.getItem("pa_aga"))||[];}catch(e){return [];}}
function sauverAGA(l){localStorage.setItem("pa_aga",JSON.stringify(l));}
function entreeAGA(par,an){return chargerAGA().find(x=>x.paroisse===par&&x.annee===an);}

/* Synthèse financière de l'année (style « NOTE 5 » du rapport) */
function syntheseFinAGA(par,an){
  const anPrec=String(parseInt(an,10)-1);
  function totaux(annee){
    const e=chargerFinances().filter(f=>f.paroisse===par&&(f.mois||"").startsWith(annee));
    if(e.length){
      const r=PLAN_REV.reduce((t,g)=>t+g.comptes.reduce((x,c)=>x+sommeCat(e,"rev",c[0]),0),0);
      const d=PLAN_DEP.reduce((t,g)=>t+g.comptes.reduce((x,c)=>x+sommeCat(e,"dep",c[0]),0),0);
      return {r:r,d:d};
    }
    const h=chargerHisto().find(x=>x.paroisse===par&&x.annee===annee);
    if(h&&(h.rev||h.dep)) return {r:h.rev||0,d:h.dep||0};
    return {r:0,d:0};
  }
  const n=totaux(an), prec=totaux(anPrec);
  return {rev:n.r,dep:n.d,res:n.r-n.d,revPrec:prec.r,depPrec:prec.d,resPrec:prec.r-prec.d};
}
/* Statistiques sacramentelles de l'année (style « NOTE 12 ») */
function statsAGA(par,an){

  return lignes.map(l=>({label:l[1],n:compteSacAn(par,l[0],an),prec:compteSacAn(par,l[0],String(parseInt(an,10)-1))}));
}

function lireFormAGA(){

    +'<table><tr><th>Comptes</th><th class="num">'+an+'</th><th class="num">'+anPrec+'</th></tr>'

  const blocStats='<h2>Rapport statistique</h2><table><tr><th></th><th class="num">'+an+'</th><th class="num">'+anPrec+'</th></tr>'
    +stats.map(s=>'<tr><td>'+s.label.toUpperCase()+'</td><td class="num">'+s.n+'</td><td class="num">'+s.prec+'</td></tr>').join("")+'</table>';
  function blocSection(id,titre){return sec(id)?'<h2>'+titre+'</h2>'+txt(id):"";}
  const corps=blocSection("cpae","Rapport du CPAÉ")+blocFin
    +blocSection("cimetiere","Cimetière")
    +blocSection("projets_acheves","Projets achevés")
    +blocSection("projets_cours","Projets en cours")
    +blocSection("projets_majeurs","Principaux projets à venir")
    +blocSection("eap","Équipe d'animation pastorale (ÉAP)")
    +blocSection("catechese","Catéchèse et préparation aux sacrements")
    +blocStats
    +blocSection("liturgique","Comité liturgique")
    +blocSection("chorales","Chorales et musiciens")
    +blocSection("evenements","Événements paroissiaux")
    +blocSection("benevoles","Bénévoles et varia");
  const dateAg=form.dateAg?formatDate(form.dateAg):"date à confirmer";
  const doc='<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Assemblée générale annuelle — '+esc(par)+' '+an+'</title>'
    +'<style>body{font-family:Georgia,serif;max-width:780px;margin:32px auto;padding:0 24px;color:#222;line-height:1.5}h1{font-size:1.4rem;margin-bottom:2px}h2{font-size:1.08rem;border-bottom:1px solid #999;padding-bottom:3px;margin-top:28px}table{border-collapse:collapse;width:100%;margin:10px 0}td,th{border:1px solid #bbb;padding:5px 9px;text-align:left}.num{text-align:right}ol.jour li{margin-bottom:4px}.meta{color:#555}.note{color:#444}</style></head><body>'

<script>
/* ============================================================
   DONNÉES INITIALES — REPRISE DES REGISTRES
   Saisie unique, par paroisse et par année, des totaux tirés
   des registres paroissiaux (statistiques sacramentelles et
   totaux financiers annuels). Ces données alimentent les
   colonnes « année précédente » des rapports dès le départ.
   ============================================================ */
let HI_PAR="", HI_AN=String(new Date().getFullYear()-1);
const STATS_CLES=[["bapteme","Baptêmes"],["eucharistie","1res communions"],["confirmation","Confirmations"],["mariage","Mariages"],["funerailles","Décès (funérailles)"]];

function chargerHisto(){try{return JSON.parse(localStorage.getItem("pa_histo"))||[];}catch(e){return [];}}
function sauverHisto(l){localStorage.setItem("pa_histo",JSON.stringify(l));}
/* Nombre de célébrations d'un sacrement pour une paroisse et une année :
   priorité au registre (données initiales) ; sinon, comptage des demandes
   passées à « Célébrée » dans la plateforme. */
function compteSacAn(par,sac,an){
  const h=chargerHisto().find(x=>x.paroisse===par&&x.annee===an);
  if(h&&(h[sac]!=null)) return h[sac]||0;
  return chargerDemandes().filter(d=>d.sacrement===sac&&d.paroisse===par&&d.statut==="celebree"&&(d.dateCelebration||"").startsWith(an)).length;
}

function viewInitial(){
  const paroisses=chargerParoisses();
  if(!HI_PAR) HI_PAR=paroisses[0];
  const selPar='<select id="hi-paroisse">'+paroisses.map(p=>'<option '+(HI_PAR===p?"selected":"")+'>'+esc(p)+'</option>').join("")+'</select>';
  const ans=[];const a0=new Date().getFullYear();for(let a=a0;a>=a0-6;a--) ans.push(String(a));
  const selAn='<select id="hi-annee">'+ans.map(a=>'<option '+(HI_AN===a?"selected":"")+'>'+a+'</option>').join("")+'</select>';
  const champs=STATS_CLES.map(c=>'<label for="hi-'+c[0]+'">'+c[1]+'</label><input type="number" min="0" step="1" id="hi-'+c[0]+'" value="0">').join("");
  const liste=chargerHisto().slice().sort((a,b)=>b.annee.localeCompare(a.annee)||a.paroisse.localeCompare(b.paroisse));
  const lignes=liste.length?liste.map(h=>{
    const stats=STATS_CLES.map(c=>(h[c[0]]||0)).join(" / ");
    return '<tr><td>'+h.annee+'</td><td>'+esc(h.paroisse)+'</td><td class="discret">'+stats+'</td><td style="text-align:right">'+fmtD(h.rev||0)+'</td><td style="text-align:right">'+fmtD(h.dep||0)+'</td><td><button class="btn petit secondaire" data-supp-histo="'+esc(h.paroisse)+'|'+h.annee+'">Supprimer</button></td></tr>';
  }).join(""):'<tr><td colspan="6" class="discret">Aucune donnée historique saisie.</td></tr>';
  return '<h3>Données initiales — reprise des registres</h3>'
    +'<div class="encart bleu"><strong>Par où commencer ?</strong> Cette page se remplit <strong>une seule fois</strong>, par paroisse et par année, à partir des registres paroissiaux (registres des baptêmes, confirmations, mariages, décès — CIC c. 535) et des états financiers annuels. Ces totaux servent de référence : vos premiers rapports afficheront immédiatement la comparaison avec les années antérieures. Pour la suite, il suffit de saisir les demandes et les feuilles financières mensuelles au fil de l\'eau — la plateforme compte alors automatiquement.</div>'
    +'<form id="formHisto"><div class="deux-col"><div><label for="hi-paroisse">Paroisse</label>'+selPar+'</div><div><label for="hi-annee">Année</label>'+selAn+'</div></div>'
    +'<h3>Statistiques sacramentelles de l\'année</h3><div class="deux-col"><div>'+champs+'</div><div>'
    +'<h3>Totaux financiers de l\'année</h3>'
    +'<label for="hi-rev">Total des revenus ($)</label><input type="number" min="0" step="0.01" id="hi-rev" value="0">'
    +'<label for="hi-dep">Total des dépenses ($)</label><input type="number" min="0" step="0.01" id="hi-dep" value="0">'
    +'</div></div><button class="btn" type="submit">Enregistrer cette année</button></form>'
    +'<h3>Données saisies</h3><table><thead><tr><th>Année</th><th>Paroisse</th><th>Bap. / 1res com. / Conf. / Mar. / Décès</th><th style="text-align:right">Revenus</th><th style="text-align:right">Dépenses</th><th></th></tr></thead><tbody>'+lignes+'</tbody></table>';
}

 ["eap","Équipe d'animation pastorale (ÉAP)","Planification et coordination de la vie pastorale des quatre paroisses de l'unité ; conseil consultatif auprès du modérateur (CIC c. 536)."],

 ["lecteur","Lecteur / Lectrice","Proclamation de la Parole de Dieu dans les célébrations ; ministère confié à des laïcs (CIC c. 230)."],
 ["servant","Servant / Servante d'autel","Service de l'autel pendant les messes et les grandes célébrations (CIC c. 230)."],
 ["sacristain","Sacristain / Sacristine","Préparation du linge, des vases sacrés et des objets de célébration ; soin de la sacristie."],
 ["communion","Ministre de la communion","Ministre extraordinaire de la communion (CIC c. 910 §2) : aide à la distribution et port de la communion aux malades."],
 ["musicien","Organiste et musicien","Animation musicale des messes, funérailles et grandes fêtes."],

 ["decor","Responsable des décors","Décoration de l'église selon les temps de l'année liturgique."],
 ["accueillant","Accueillant à l'entrée de l'église","Accueil des fidèles et des visiteurs, remise des feuillets, orientation."],
 ["queteur","Collecteur des offrandes (quête)","Service de la quête pendant les célébrations."],
 ["cpae","Comité paroissial des affaires économiques (CPAÉ)","Conseil obligatoire qui aide à l'administration des biens de la paroisse (CIC c. 537)."],
 ["devpaix","Responsable Développement et Paix","Relais paroissial de l'organisme de la CECC ; collecte du Carême de partage et sensibilisation."],
 ["baptemes","Préparation aux baptêmes","Accueil et accompagnement des familles qui demandent le baptême."],
 ["catechete","Catéchète","Catéchèse des enfants et préparation aux sacrements (CIC c. 230 §1)."],

];
function ministere(id){const m=MINISTERES.find(m=>m[0]===id);return m?m[1]:id;}

let BEN_TAB="servir", BEN_PAR="toutes", BEN_MIN="tous";

 "Être membre de la communauté paroissiale et souhaiter servir régulièrement ; la plupart des services s'adressent aux adultes — les jeunes sont bienvenus comme servants d'autel, en chorale ou à l'accueil, avec le consentement des parents.",
 "Pour les services liturgiques (lecteur, ministre de la communion) : être baptisé, confirmé, fidèle à la pratique et en règle avec l'Église ; le service est confié par un mandat du modérateur.",

 "L'engagement se fait pour l'année pastorale et est renouvelable."
];

  const onglets='<div class="filtres"><button data-btab="servir" class="'+(BEN_TAB==="servir"?"actif":"")+'">Je veux servir</button><button data-btab="gestion" class="'+(BEN_TAB==="gestion"?"actif":"")+'">Gestion (paroisse)</button><button data-btab="repertoire" class="'+(BEN_TAB==="repertoire"?"actif":"")+'">Répertoire</button></div>';

function viewGestionBenevoles(){
  const paroisses=chargerParoisses();
  const tous=chargerBenevoles();
  const candidats=tous.filter(b=>b.statut==="candidat");
  const actifs=tous.filter(b=>b.statut==="actif");
  const selPar='<select id="ben-par" style="max-width:220px"><option value="toutes">Toutes les paroisses</option>'+paroisses.map(p=>'<option '+(BEN_PAR===p?"selected":"")+'>'+esc(p)+'</option>').join("")+'</select>';
  const selMin='<select id="ben-min" style="max-width:260px"><option value="tous">Tous les services</option>'+MINISTERES.map(m=>'<option value="'+m[0]+'" '+(BEN_MIN===m[0]?"selected":"")+'>'+m[1]+'</option>').join("")+'</select>';
  const liste=tous.filter(b=>b.statut!=="archive")
    .filter(b=>BEN_PAR==="toutes"||b.paroisse===BEN_PAR)
    .filter(b=>BEN_MIN==="tous"||(b.ministeres||[]).includes(BEN_MIN))
    .sort((a,b)=>(a.statut===b.statut?a.nom.localeCompare(b.nom):a.statut==="candidat"?-1:1));
  const lignes=liste.length?liste.map(b=>{
    const mins=(b.ministeres||[]).map(ministere).join(", ");
    const badge=b.statut==="candidat"?'<span class="badge st-nouvelle">Candidature</span>':'<span class="badge st-prete">Actif</span>';

      :'<button class="btn petit secondaire" data-ben-act="archiver|'+b.id+'">Archiver</button>';
    const flags=(b.adulte==="jeune"?' <span class="badge st-instruction">Jeune</span>':"")+(b.verif?' <span class="discret" title="Consentement à la vérification des antécédents">vérif. consentie</span>':"");
    return '<tr><td><strong>'+esc(b.nom)+'</strong>'+flags+'<br><span class="discret">'+esc(b.tel)+(b.courriel?' · '+esc(b.courriel):"")+'</span></td><td>'+esc(b.paroisse)+'</td><td>'+esc(mins)+(b.dispo?'<br><span class="discret">Dispo : '+esc(b.dispo)+'</span>':"")+(b.message?'<br><span class="discret">« '+esc(b.message)+' »</span>':"")+'</td><td>'+badge+'</td><td>'+actions+'</td></tr>';
  }).join(""):'<tr><td colspan="5" class="discret">Aucun bénévole pour ce filtre.</td></tr>';
  return '<p class="discret"><strong>'+actifs.length+'</strong> bénévole(s) actif(s) · <strong>'+candidats.length+'</strong> candidature(s) en attente. Les propositions envoyées depuis « Je veux servir » arrivent ici comme candidatures.</p>'
    +'<div class="actions-ligne" style="margin:0 0 12px">'+selPar+selMin+'<button class="btn petit secondaire" id="btn-csv-benevoles">Exporter CSV</button></div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Bénévole</th><th>Paroisse</th><th>Services</th><th>Statut</th><th>Actions</th></tr></thead><tbody>'+lignes+'</tbody></table></div>'
    +'<div class="encart"><strong>Repères.</strong> Le conseil de pastorale (ÉAP, c. 536) est consultatif ; le conseil pour les affaires économiques (CPAÉ, c. 537) est obligatoire dans chaque paroisse ; lecteurs, servants et catéchètes relèvent des ministères laïcs (c. 230) ; les ministres de la communion agissent à titre extraordinaire (c. 910 §2). Les candidatures sensibles (catéchèse, contact avec des mineurs ou des personnes vulnérables) supposent une vérification selon la politique diocésaine de protection.</div>';
}

function viewRepertoire(){
  const paroisses=chargerParoisses();
  const actifs=chargerBenevoles().filter(b=>b.statut==="actif");
  let corps="";
  paroisses.forEach(p=>{
    const vols=actifs.filter(b=>b.paroisse===p);
    if(!vols.length) return;
    const lignes=MINISTERES.map(m=>{
      const gens=vols.filter(b=>(b.ministeres||[]).includes(m[0]));
      if(!gens.length) return "";
      return '<tr><td style="vertical-align:top;width:42%"><strong>'+m[1]+'</strong></td><td>'+gens.map(b=>'<strong>'+esc(b.nom)+'</strong>'+(b.adulte==="jeune"?' <span class="discret">(jeune)</span>':"")+'<br><span class="discret">'+esc(b.tel||"")+(b.courriel?" · "+esc(b.courriel):"")+(b.dispo?" · "+esc(b.dispo):"")+'</span>').join("<br><br>")+'</td></tr>';
    }).join("");
    corps+='<h3>'+esc(p)+'</h3><table><tbody>'+lignes+'</tbody></table>';
  });
  if(!corps) corps='<p class="discret">Aucun bénévole actif pour le moment.</p>';
  return '<p class="discret">Répertoire des bénévoles actifs, par paroisse et par service, avec leurs coordonnées. Imprimable pour le secrétariat et les responsables de services.</p>'
    +'<div class="actions-ligne" style="margin:0 0 12px"><button class="btn petit secondaire" id="btn-csv-benevoles">Exporter CSV</button><button class="btn petit secondaire btn-print">Imprimer</button></div>'+corps;
}

document.addEventListener("submit",function(e){
  if(e.target.id==="formHisto"){
    e.preventDefault();
    const h={paroisse:HI_PAR,annee:HI_AN};
    STATS_CLES.forEach(c=>{h[c[0]]=parseInt(document.getElementById("hi-"+c[0]).value,10)||0;});
    h.rev=parseFloat(document.getElementById("hi-rev").value)||0;
    h.dep=parseFloat(document.getElementById("hi-dep").value)||0;
    const liste=chargerHisto().filter(x=>!(x.paroisse===h.paroisse&&x.annee===h.annee));
    liste.push(h); sauverHisto(liste); route();
  }
  else if(e.target.id==="formBenevole"){
    e.preventDefault();
    const mins=Array.from(document.querySelectorAll(".bv-min:checked")).map(x=>x.value);
    if(!mins.length){alert("Choisissez au moins un service.");return;}
    const liste=chargerBenevoles();
    if(!document.getElementById("bv-cond").checked){alert("Vous devez accepter les conditions pour être bénévole.");return;}
    liste.push({id:"bv"+Date.now().toString(36),nom:document.getElementById("bv-nom").value,
      paroisse:document.getElementById("bv-paroisse").value,
      tel:document.getElementById("bv-tel").value,courriel:document.getElementById("bv-courriel").value,
      adulte:document.getElementById("bv-adulte").value,
      verif:document.getElementById("bv-verif").checked,
      ministeres:mins,dispo:document.getElementById("bv-dispo").value,message:document.getElementById("bv-message").value,
      statut:"candidat",date:new Date().toISOString().slice(0,10)});
    sauverBenevoles(liste);
    e.target.innerHTML='<div class="encart vert"><strong>Merci !</strong> Votre proposition a été transmise à l\'équipe pastorale. Un responsable vous contactera pour vous accueillir et vous former au service choisi.</div>';

});
document.addEventListener("click",function(e){
  const t=e.target;
  const bt=t.closest("[data-btab]"); if(bt){BEN_TAB=bt.getAttribute("data-btab");route();return;}
  const ba=t.closest("[data-ben-act]");
  if(ba){
    const parts=ba.getAttribute("data-ben-act").split("|");
    const liste=chargerBenevoles();const b=liste.find(x=>x.id===parts[1]);
    if(b){b.statut=parts[0]==="integrer"?"actif":"archive";sauverBenevoles(liste);}
    route();return;
  }
  const sh=t.closest("[data-supp-histo]");
  if(sh){const cle=sh.getAttribute("data-supp-histo").split("|");sauverHisto(chargerHisto().filter(x=>!(x.paroisse===cle[0]&&x.annee===cle[1])));route();return;}
  if(t.id==="btn-csv-benevoles"){
    const lignes=[["Nom","Paroisse","Services","Téléphone","Courriel","Disponibilités","Statut"]];
    chargerBenevoles().filter(b=>b.statut!=="archive").forEach(b=>lignes.push([b.nom,b.paroisse,(b.ministeres||[]).map(ministere).join(" | "),b.tel,b.courriel||"",b.dispo||"",b.statut]));
    exportCSV("benevoles-unite.csv",lignes);return;
  }
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="hi-paroisse"){HI_PAR=t.value;route();return;}
  if(t.id==="hi-annee"){HI_AN=t.value;route();return;}
  if(t.id==="ben-par"){BEN_PAR=t.value;route();return;}
  if(t.id==="ben-min"){BEN_MIN=t.value;route();return;}
});

function formatDate(d){if(!d)return "—";const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);const dt=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(d);return isNaN(dt)?d:dt.toLocaleDateString(lang()==="en"?"en-CA":"fr-CA");}
function plage(debut,fin){return formatDate(debut)+(lang()==="en"?" to ":" au ")+formatDate(fin);}
function datesGuide(id){
  const maintenant=new Date(); maintenant.setHours(0,0,0,0);
  const a=maintenant.getFullYear(); const en=lang()==="en";
  const L=en?{avent:"Advent",noel:"Christmas",careme:"Lent",triduum:"Easter Triduum"}:{avent:"Avent",noel:"Noël",careme:"Carême",triduum:"Triduum pascal"};
  const candidats=[];
  [a,a+1].forEach(an=>{
    if(id==="avent") candidats.push({label:L.avent+" "+an,debut:premierAvent(an),fin:new Date(an,11,24)});
    if(id==="noel") candidats.push({label:L.noel+" "+an,debut:new Date(an,11,24),fin:new Date(an,11,25)});
    if(id==="careme") candidats.push({label:L.careme+" "+an,debut:jours(paques(an),-46),fin:jours(paques(an),-4)});
    if(id==="triduum") candidats.push({label:L.triduum+" "+an,debut:jours(paques(an),-3),fin:paques(an)});
  });
  return candidats.filter(c=>c.fin>=maintenant).slice(0,2);
}

document.addEventListener("click",function(e){
  const t=e.target;

    if(!confirm("Retirer les demandes et les bénévoles fictifs de démonstration ? Vos vraies données (paramètres, registres, finances, messes) seront conservées.")) return;
    const refsDemo=["BAP-2026-A1B2","MAR-2026-C3D4","CON-2026-G7H8","FUN-2026-E5F6","BAP-2026-I9J0"];
    sauverDemandes(chargerDemandes().filter(d=>refsDemo.indexOf(d.ref)===-1));

    localStorage.setItem("pa_seed_v2","1");localStorage.setItem("pa_seed_v3","1");localStorage.setItem("pa_seed_v5","1");
    route();return;
  }
  if(t.id==="btn-ajout-messe"){
    const m=chargerMesses();
    m.push({jour:parseInt(document.getElementById("m-jour").value,10),
      heure:document.getElementById("m-heure").value||"19:00",
      paroisse:document.getElementById("m-paroisse").value,
      note:document.getElementById("m-note").value});

});

/* ---------- Calculs de dates ---------- */
function dimancheEntre(y,m,d1,d2){for(let d=d1;d<=d2;d++){const dt=new Date(y,m,d);if(dt.getDay()===0)return dt;}return null;}
function epiphanie(a){return dimancheEntre(a,0,2,8);} /* dimanche entre le 2 et le 8 janvier (Canada) */
function baptemeSeigneur(a){const e=epiphanie(a);return e.getDate()>=7?jours(e,1):jours(e,7);}
function christRoi(a){return jours(premierAvent(a),-7);}

const ORDRE_LIT=["avent","noel","ord1","careme","triduum","pascal","ord2"];
function saisonInfo(id){const s=SAISONS_INFO[id];return Object.assign({coul:s.coul},lang()==="en"?s.en:s.fr);}

/* Plages de dates des temps pour l'année civile a (ordre chronologique) */
function saisonsAnnee(a){
  const cen=jours(paques(a),-46), paq=paques(a), pen=jours(paq,49), av=premierAvent(a);
  return [
   {id:"ord1",debut:jours(baptemeSeigneur(a),1),fin:jours(cen,-1)},
   {id:"careme",debut:cen,fin:jours(paq,-3)},
   {id:"triduum",debut:jours(paq,-3),fin:paq},
   {id:"pascal",debut:paq,fin:pen},
   {id:"ord2",debut:jours(pen,1),fin:jours(av,-1)},
   {id:"avent",debut:av,fin:new Date(a,11,24)},
   {id:"noel",debut:new Date(a,11,25),fin:baptemeSeigneur(a+1)}
  ];
}

/* Grandes fêtes de l'année civile a */
function fetesAnnee(a){
  const paq=paques(a); const en=lang()==="en";
  return [
   [en?"Mary, Mother of God (holyday of obligation)":"Marie, Mère de Dieu (fête d'obligation)",new Date(a,0,1)],
   [en?"Epiphany":"Épiphanie",epiphanie(a)],
   [en?"Baptism of the Lord":"Baptême du Seigneur",baptemeSeigneur(a)],
   [en?"Presentation of the Lord":"Présentation du Seigneur",new Date(a,1,2)],
   [en?"Saint Joseph":"Saint Joseph",new Date(a,2,19)],
   [en?"Annunciation":"Annonciation",new Date(a,2,25)],
   [en?"Palm Sunday":"Dimanche des Rameaux",jours(paq,-7)],
   [en?"Holy Thursday":"Jeudi saint",jours(paq,-3)],
   [en?"Good Friday":"Vendredi saint",jours(paq,-2)],
   [en?"Easter Sunday":"Dimanche de Pâques",paq],
   [en?"Ascension (celebrated on Sunday in Canada)":"Ascension (célébrée le dimanche au Canada)",jours(paq,42)],
   [en?"Pentecost":"Pentecôte",jours(paq,49)],
   [en?"Most Holy Trinity":"Sainte Trinité",jours(paq,56)],
   [en?"Body and Blood of Christ":"Saint-Sacrement (Corps et Sang du Christ)",jours(paq,63)],
   [en?"Sacred Heart of Jesus":"Sacré-Cœur de Jésus",jours(paq,68)],
   [en?"Nativity of Saint John the Baptist":"Nativité de saint Jean-Baptiste",new Date(a,5,24)],
   [en?"Saints Peter and Paul":"Saints Pierre et Paul",new Date(a,5,29)],
   [en?"Assumption — Acadian national day":"Assomption — fête nationale des Acadiens",new Date(a,7,15)],
   [en?"All Saints":"Toussaint",new Date(a,10,1)],
   [en?"All Souls":"Commémoration des fidèles défunts",new Date(a,10,2)],
   [en?"Christ the King":"Christ-Roi",christRoi(a)],
   [en?"Immaculate Conception":"Immaculée Conception",new Date(a,11,8)],
   [en?"Christmas":"Noël",new Date(a,11,25)]
  ].sort((x,y)=>x[1]-y[1]);
}

/* ---------- Les trois vues ---------- */
function viewCalendrier(){
  const a=new Date().getFullYear();
  const lignesSaisons=saisonsAnnee(a).map(s=>{
    const info=saisonInfo(s.id);
    return '<tr><td><strong>'+esc(info.nom)+'</strong></td><td>'+plage(s.debut,s.fin)+'</td><td>'+puceCoul(info.coul)+'</td></tr>';
  }).join("");
  const lignesFetes=fetesAnnee(a).map(f=>'<tr><td>'+esc(f[0])+'</td><td>'+formatDate(f[1])+'</td></tr>').join("");
  return '<a class="retour" href="#/liturgie">'+t("retour_lit")+'</a>'
    +'<div class="carte"><h2>🗓️ '+t("cal_titre")+' — '+a+'</h2>'
    +'<p class="discret">'+t("note_annee")+' '+t("fetes_obligation")+'</p>'

}

function blocPretres(){
  const p=params();
  const lignes=(p.pretres||"").split("\n").map(x=>x.trim()).filter(Boolean);
  if(!lignes.length) return "";
  const items=lignes.map(l=>{
    const m=l.split(/\s*[—–,;|]\s*/);
    const nom=m.shift(); const contact=m.join(" · ");
    return '<tr><td style="width:42%;vertical-align:top"><strong>'+esc(nom)+'</strong></td><td><span class="discret">'+esc(contact)+'</span></td></tr>';
  }).join("");
  return '<h3>'+t("pretres_titre")+'</h3><table><tbody>'+items+'</tbody></table>';
}

function viewRepertoire(){
  const paroisses=chargerParoisses();
  const actifs=chargerBenevoles().filter(b=>b.statut==="actif");
  let corps=blocPretres();
  paroisses.forEach(p=>{
    const vols=actifs.filter(b=>b.paroisse===p);
    if(!vols.length) return;
    const lignes=MINISTERES.map(m=>{
      const gens=vols.filter(b=>(b.ministeres||[]).includes(m[0]));
      if(!gens.length) return "";
      return '<tr><td style="vertical-align:top;width:42%"><strong>'+m[1]+'</strong></td><td>'+gens.map(b=>'<strong>'+esc(b.nom)+'</strong>'+(b.adulte==="jeune"?' <span class="discret">(jeune)</span>':"")+'<br><span class="discret">'+esc(b.tel||"")+(b.courriel?" · "+esc(b.courriel):"")+(b.dispo?" · "+esc(b.dispo):"")+'</span>').join("<br><br>")+'</td></tr>';
    }).join("");
    corps+='<h3>'+esc(p)+'</h3><table><tbody>'+lignes+'</tbody></table>';
  });
  if(!corps) corps='<p class="discret">'+t("rep_vide")+'</p>';
  return '<p class="discret">'+t("rep_intro")+'</p>'
    +'<div class="actions-ligne" style="margin:0 0 12px"><button class="btn petit secondaire" id="btn-csv-benevoles">Exporter CSV</button><button class="btn petit secondaire btn-print">'+(lang()==="en"?"Print":"Imprimer")+'</button></div>'+corps;
}

route();

/* Routeur : ajout de la route #/feuillet */
function route(){
  const h=location.hash||"#/"; const app=document.getElementById("app");
  let nav="accueil", html="";
  if(h==="#/"||h==="#") html=viewAccueil();
  else if(h==="#/demande"){html=viewDemandeListe();nav="demande";}
  else if(h.indexOf("#/demande/")===0){html=viewDemandeForm(h.slice(10));nav="demande";}
  else if(h.indexOf("#/confirmation/")===0){html=viewConfirmation(decodeURIComponent(h.slice(15)));nav="suivi";}
  else if(h==="#/suivi"){html=viewSuivi();nav="suivi";}
  else if(h==="#/paroisse"){html=viewParoisse();nav="paroisse";}
  else if(h.indexOf("#/paroisse/")===0){html=viewDetail(decodeURIComponent(h.slice(11)));nav="paroisse";}
  else if(h==="#/liturgie"){html=viewLiturgie();nav="liturgie";}
  else if(h.indexOf("#/liturgie/")===0){html=viewLiturgieGuide(h.slice(11));nav="liturgie";}
  else if(h==="#/feuillet"){html=viewFeuillet();nav="liturgie";}
  else if(h==="#/benevoles"){html=viewBenevoles();nav="benevoles";}
  else if(h==="#/rapports"){html=viewRapports();nav="rapports";}
  else if(h==="#/parametres"){html=viewParametres();nav="parametres";}
  else html=viewAccueil();
  app.innerHTML=html; window.scrollTo(0,0);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("actif",a.getAttribute("data-nav")===nav));
  majEntete();
}

function nomStatutInt(id){const s=STATUTS_INT.find(s=>s.id===id);return s?s.nom:id;}
function progressionIntHTML(statut){
  const idx=STATUTS_INT.findIndex(s=>s.id===statut);

/* ---------- Événements ---------- */
function dateEv(e){return e.date+"T"+(e.heure||"00:00");}
function dateLocaleEv(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(d);}
function evenementsAvenir(){
  const auj=new Date(); auj.setHours(0,0,0,0);
  return chargerEvenements().filter(e=>dateLocaleEv(e.date)>=auj).sort((a,b)=>dateEv(a).localeCompare(dateEv(b)));
}
function ligneEvenement(e){
  const dt=dateLocaleEv(e.date);
  const mois=dt.toLocaleDateString(lang()==="en"?"en-CA":"fr-CA",{month:"short"}).replace(/\./g,"");
  return '<div class="ev-ligne"><div class="ev-date"><span class="j">'+dt.getDate()+'</span><span class="m">'+esc(mois)+'</span></div>'
    +'<div class="ev-corps"><strong>'+esc(e.titre)+'</strong>'
    +'<span class="discret">'+(e.heure?esc(e.heure)+(e.lieu?" — ":""):"")+esc(e.lieu||"")+'</span>'
    +(e.desc?'<br>'+esc(e.desc):"")+'</div></div>';
}
function moisAnneeEv(cle){
  const dt=dateLocaleEv(cle+"-01");
  return dt.toLocaleDateString(lang()==="en"?"en-CA":"fr-CA",{month:"long",year:"numeric"});
}
function viewEvenements(){
  const ev=evenementsAvenir();
  let corps;
  if(!ev.length) corps='<p class="discret">'+t("ev_vide")+'</p>';
  else{
    const groupes={},ordre=[];
    ev.forEach(e=>{const k=e.date.slice(0,7);if(!groupes[k]){groupes[k]=[];ordre.push(k);}groupes[k].push(e);});
    corps=ordre.map(k=>'<h3 style="text-transform:capitalize">'+moisAnneeEv(k)+'</h3>'+groupes[k].map(ligneEvenement).join("")).join("");
  }
  return '<a class="retour" href="#/">&larr; '+t("retour_accueil").replace(/^← /,"")+'</a>'
    +'<div class="carte"><h2>📅 '+t("ev_titre")+'</h2><p class="discret">'+t("ev_intro")+'</p>'+corps+'</div>';
}
function blocAVenir(){
  const ev=evenementsAvenir().slice(0,3);
  if(!ev.length) return "";
  return '<div class="carte"><h2>📅 '+t("ev_a_venir")+'</h2>'+ev.map(ligneEvenement).join("")
    +'<p style="margin:8px 0 0"><a href="#/evenements">'+t("ev_tout")+' &rarr;</a></p></div>';
}

/* ---------- Suivi : intentions en plus des sacrements ---------- */
function renderSuivi(ref){
  const zone=document.getElementById("suivi-resultat");
  const d=chargerDemandes().find(x=>x.ref.toUpperCase()===ref.toUpperCase());
  if(!d){
    const it=chargerIntentions().find(x=>x.ref.toUpperCase()===ref.toUpperCase());
    if(!it){zone.innerHTML='<div class="encart rouge">'+t("suivi_introuvable")+'</div>';return;}
    let msg=t("msg_int_"+it.statut);
    if(it.statut==="planifiee"&&it.messePrevue) msg+=esc(it.messePrevue);
    zone.innerHTML='<h3 style="margin-top:22px">🕯️ '+t("int_titre")+' — '+esc(it.intention)+'</h3>'
      +progressionIntHTML(it.statut)+'<div class="encart bleu">'+msg+'</div>';
    return;
  }
  const s=sacrement(d.sacrement);
  let message=t("msg_"+d.statut);
  if(d.statut==="celebree"){
    if(d.dateCelebration) message+=lang()==="en"?(" on "+formatDate(d.dateCelebration)):(" le "+formatDate(d.dateCelebration));
    message+=lang()==="en"?". God bless you!":". Que Dieu vous bénisse !";
  }
  zone.innerHTML='<h3 style="margin-top:22px">'+esc(sacNom(s))+' — '+esc(d.paroisse)+'</h3>'
    +progressionHTML(d.statut)+'<div class="encart bleu">'+message+'</div>';
}

/* ---------- Handlers phase 2 ---------- */
document.addEventListener("click",function(e){
  const c=e.target;
  if(c.id==="btn-ajout-ev"){
    const titre=document.getElementById("ev-titre").value.trim();
    const date=document.getElementById("ev-date").value;
    if(!date||!titre){alert("La date et le titre de l'événement sont requis.");return;}
    const ev=chargerEvenements();
    ev.push({id:"ev"+Date.now().toString(36),date:date,heure:document.getElementById("ev-heure").value,
      titre:titre,lieu:document.getElementById("ev-lieu").value.trim(),desc:document.getElementById("ev-desc").value.trim()});
    sauverEvenements(ev);route();return;
  }
  const sv=c.closest("[data-supp-ev]");
  if(sv){sauverEvenements(chargerEvenements().filter(x=>x.id!==sv.getAttribute("data-supp-ev")));route();return;}
  const ip=c.closest("[data-int-plan]");
  if(ip){
    const liste=chargerIntentions();const it=liste.find(x=>x.ref===ip.getAttribute("data-int-plan"));if(!it)return;
    const champ=document.getElementById("int-messe-prevue");
    const val=champ?champ.value.trim():"";
    if(!val){alert("Indiquez la messe prévue avant de marquer l'intention comme planifiée.");return;}
    it.messePrevue=val;it.statut="planifiee";sauverIntentions(liste);route();return;
  }
  const ic=c.closest("[data-int-cel]");
  if(ic){const liste=chargerIntentions();const it=liste.find(x=>x.ref===ic.getAttribute("data-int-cel"));if(it){it.statut="celebree";sauverIntentions(liste);}route();return;}
});
document.addEventListener("change",function(e){
  const c=e.target;
  if(c.id==="note-int"){
    const liste=chargerIntentions();const it=liste.find(x=>x.ref===c.getAttribute("data-ref"));
    if(it){it.note=c.value;sauverIntentions(liste);}return;
  }
});

/* ---------- Routeur : nouvelles routes phase 2 ---------- */
function route(){
  const h=location.hash||"#/"; const app=document.getElementById("app");
  let nav="accueil", html="";
  if(h==="#/"||h==="#") html=viewAccueil();
  else if(h==="#/demande"){html=viewDemandeListe();nav="demande";}
  else if(h.indexOf("#/demande/")===0){html=viewDemandeForm(h.slice(10));nav="demande";}
  else if(h.indexOf("#/confirmation/")===0){html=viewConfirmation(decodeURIComponent(h.slice(15)));nav="suivi";}
  else if(h==="#/suivi"){html=viewSuivi();nav="suivi";}
  else if(h==="#/paroisse"){html=viewParoisse();nav="paroisse";}
  else if(h.indexOf("#/paroisse/")===0){html=viewDetail(decodeURIComponent(h.slice(11)));nav="paroisse";}
  else if(h==="#/liturgie"){html=viewLiturgie();nav="liturgie";}
  else if(h.indexOf("#/liturgie/")===0){html=viewLiturgieGuide(h.slice(11));nav="liturgie";}
  else if(h==="#/feuillet"){html=viewFeuillet();nav="liturgie";}
  else if(h==="#/intention"){html=viewIntention();nav="liturgie";}
  else if(h==="#/evenements"){html=viewEvenements();nav="evenements";}
  else if(h==="#/galerie"){html=viewGalerie();nav="galerie";}
  else if(h==="#/benevoles"){html=viewBenevoles();nav="benevoles";}
  else if(h==="#/rapports"){html=viewRapports();nav="rapports";}
  else if(h==="#/parametres"){html=viewParametres();nav="parametres";}
  else html=viewAccueil();
  app.innerHTML=html; window.scrollTo(0,0);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("actif",a.getAttribute("data-nav")===nav));
  majEntete();
}
